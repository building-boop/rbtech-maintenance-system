<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script>
  // 🔧 ตั้งค่า URL ของ Apps Script Web App ที่ deploy ไว้ (ลงท้ายด้วย /exec)
 window.GAS_API_URL = "https://script.google.com/macros/s/AKfycbwEFb84WqkbINirK8hATME1rNG69X0C504lX_deoeXLePICpFjL5BcZlBAmE5hgRhL2lw/exec";
</script>
<script src="gas-bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบรายงานผลการทำความสะอาด - วิทยาลัยเทคนิครัตนบุรี</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root {
    --primary: #8A1C14; /* สีแดงเลือดหมูประจำสถาบัน */
    --primary-dark: #66100B;
    --accent: #D4AF37; /* สีทองประดับ */
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --success: #1E4620;
    --danger: #A61C1C;
    --text-main: #2D3142;
    --text-muted: #6C757D;
    --border: #E2E8F0;
    --radius-lg: 12px;
    --radius-md: 8px;
  }
  
  * { box-sizing: border-box; }
  
  body {
    font-family: 'Sarabun', 'Prompt', sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    margin: 0;
    padding: 30px 15px 80px;
  }
  
  h1, h2, h3, .font-display { 
    font-family: 'Prompt', sans-serif; 
    font-weight: 600;
  }

  .page-wrap { max-width: 1000px; margin: 0 auto; }

  /* ---------- Institutional Header ---------- */
  .institution-header {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    border-top: 6px solid var(--primary);
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    gap: 20px;
  }
  
  .college-logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
    flex-shrink: 0;
  }
  
  .header-text h1 {
    font-size: 1.5rem;
    color: var(--primary);
    margin: 0 0 4px 0;
    font-weight: 700;
  }
  
  .header-text h2 {
    font-size: 1.15rem;
    color: var(--text-main);
    margin: 0 0 8px 0;
  }
  
  .date-tag {
    font-size: 0.88rem;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #F8FAFC;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* ---------- Layout Grid ---------- */
  .layout-grid { display: block; }

  .form-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    border: 1px solid var(--border);
  }

  .step-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 10px;
  }
  
  .step-badge {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    font-family: 'Prompt', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  
  .step-label {
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--primary-dark);
    font-family: 'Prompt', sans-serif;
  }

  .form-select {
    border-radius: var(--radius-md);
    border: 1.5px solid #CBD5E1;
    padding: 10px 14px;
    font-size: 0.95rem;
    color: var(--text-main);
    transition: all 0.2s;
  }
  
  .form-select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(138, 28, 20, 0.15);
  }

  /* Formal Toggle Pills */
  .toggle-row { display: flex; gap: 12px; }
  .btn-check { position: absolute; opacity: 0; pointer-events: none; }
  
  .toggle-opt {
    flex: 1;
    text-align: center;
    padding: 14px 10px;
    border-radius: var(--radius-md);
    border: 1.5px solid #CBD5E1;
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    background: #F8FAFC;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  
  .toggle-opt:hover {
    border-color: #94A3B8;
    background: #F1F5F9;
  }
  
  .btn-check:checked + .toggle-opt.good {
    background: #E8F5E9;
    border-color: #2E7D32;
    color: #1B5E20;
    font-weight: 600;
  }
  
  .btn-check:checked + .toggle-opt.bad {
    background: #FFEBEE;
    border-color: #C62828;
    color: #B71C1C;
    font-weight: 600;
  }

  /* Photo Upload Zone */
  .upload-zone {
    border: 2px dashed #CBD5E1;
    border-radius: var(--radius-md);
    padding: 30px 20px;
    text-align: center;
    background: #F8FAFC;
    position: relative;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .upload-zone:hover {
    border-color: var(--primary);
    background: #FFF5F5;
  }
  
  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  
  .upload-zone .u-icon { font-size: 2rem; color: var(--text-muted); margin-bottom: 5px; }
  .upload-zone .u-text { font-size: 0.92rem; color: var(--text-main); font-weight: 500; }
  .upload-zone .u-subtext { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }
  
  #previewWrap { margin-top: 15px; display: none; }
  #previewImg { 
    width: 100%; 
    max-height: 240px; 
    object-fit: cover; 
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
  }

  /* Status Summary Panel */
  .meter-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
  }
  
  .meter-top { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 12px; 
  }
  
  .meter-top .label { 
    font-size: 0.95rem; 
    color: var(--text-main); 
    font-weight: 600; 
    font-family: 'Prompt', sans-serif;
  }
  
  .meter-top .score { 
    font-family: 'Prompt', sans-serif; 
    font-weight: 700; 
    font-size: 1.15rem; 
    color: var(--primary);
    background: #FFF5F5;
    padding: 2px 10px;
    border-radius: 6px;
  }
  
  .meter-track {
    height: 8px; border-radius: 99px; background: #E2E8F0; overflow: hidden; display: flex; gap: 4px;
  }
  
  .meter-seg { flex: 1; transition: all 0.3s ease; }
  .meter-seg.on { background: #2E7D32; }
  .meter-seg.warn { background: #D32F2F; }
  .meter-msg { font-size: 0.88rem; margin-top: 10px; color: var(--text-muted); font-weight: 500; }

  /* Submit Button */
  .submit-bar { margin-top: 10px; }
  .btn-send {
    width: 100%; 
    padding: 14px; 
    border: none; 
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; 
    font-family: 'Prompt', sans-serif; 
    font-weight: 600; 
    font-size: 1.1rem;
    box-shadow: 0 4px 12px rgba(138, 28, 20, 0.3);
    transition: all 0.2s;
  }
  
  .btn-send:hover {
    box-shadow: 0 6px 16px rgba(138, 28, 20, 0.4);
    filter: brightness(1.1);
  }
.college-logo {
  width: 75px;
  height: 75px;
  object-fit: contain;
  display: block;
  flex-shrink: 0;
}
.logo-wrap {
  width: 75px;
  height: 75px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
  
  .btn-send:active { transform: scale(.99); }

  /* ---------- Desktop Grid Layout ---------- */
  @media (min-width: 860px) {
    body { padding: 40px 20px; }
    .page-wrap { max-width: 960px; }
    .layout-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 24px;
      align-items: start;
    }
    .meter-card { position: sticky; top: 30px; margin-bottom: 0; }
    .side-col { display: flex; flex-direction: column; gap: 20px; }
    .form-card { margin-bottom: 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  }

  @media (max-width: 576px) {
    .institution-header { flex-direction: column; text-align: center; padding: 20px 15px; gap: 12px; }
    .college-logo { width: 75px; height: 75px; }
    .header-text h1 { font-size: 1.25rem; }
    .header-text h2 { font-size: 1rem; }
    .toggle-opt { font-size: 0.88rem; padding: 12px 6px; }
  }
</style>
</head>
<body>

<div class="page-wrap">

  <!-- Institutional Header -->
  <div class="institution-header">
<div class="logo-wrap">
  <img
    class="college-logo"
    src="https://lh3.googleusercontent.com/d/1fRohMoXnyqmqrXWYxy84vKo_6jRyBfhA"
    alt="โลโก้วิทยาลัยเทคนิครัตนบุรี">
</div>
    <div class="header-text">
      <h1>วิทยาลัยเทคนิครัตนบุรี</h1>
      <h2>ระบบรายงานผลการปฏิบัติงานทำความสะอาดประจำวัน</h2>
      <div class="date-tag" id="todayTag">กำลังโหลดวันที่...</div>
    </div>
  </div>

  <div class="layout-grid">

    <!-- Main Form Column -->
    <div class="main-col">
      <form id="dailyForm" onsubmit="event.preventDefault(); handleSubmit('Daily_Logs', this);">

        <div class="form-card grid-2 mb-4">
          <div class="mb-3 mb-md-0">
            <div class="step-row">
              <div class="step-badge">1</div>
              <div class="step-label">ผู้ปฏิบัติงาน / เจ้าหน้าที่</div>
            </div>
            <select class="form-select" name="staff_name" id="daily_staff" required>
              <option>กำลังโหลดรายชื่อ...</option>
            </select>
          </div>
          <div>
            <div class="step-row">
              <div class="step-badge">2</div>
              <div class="step-label">อาคาร / สถานที่</div>
            </div>
            <select class="form-select" name="location" id="daily_loc" required>
              <option>กำลังโหลดสถานที่...</option>
            </select>
          </div>
        </div>

        <div class="form-card mb-4">
          <div class="step-row">
            <div class="step-badge">3</div>
            <div class="step-label">การตรวจสอบความสะอาดโดยรวม</div>
          </div>
          <div class="toggle-row">
            <input type="radio" class="btn-check" name="task_cleaning" id="c_ok" value="เรียบร้อย" checked>
            <label class="toggle-opt good" for="c_ok"><span>✓</span> เรียบร้อยดี</label>
            <input type="radio" class="btn-check" name="task_cleaning" id="c_ng" value="ต้องปรับปรุง">
            <label class="toggle-opt bad" for="c_ng"><span>✗</span> ต้องปรับปรุง</label>
          </div>
        </div>

        <div class="form-card mb-4">
          <div class="step-row">
            <div class="step-badge">4</div>
            <div class="step-label">การจัดการขยะและภาชนะรองรับ</div>
          </div>
          <div class="toggle-row">
            <input type="radio" class="btn-check" name="task_trash" id="t_ok" value="เรียบร้อย" checked>
            <label class="toggle-opt good" for="t_ok"><span>✓</span> ดำเนินการเทขยะแล้ว</label>
            <input type="radio" class="btn-check" name="task_trash" id="t_ng" value="ต้องปรับปรุง">
            <label class="toggle-opt bad" for="t_ng"><span>✗</span> ยังไม่ได้จัดการ</label>
          </div>
        </div>

        <div class="form-card mb-4">
          <div class="step-row">
            <div class="step-badge">5</div>
            <div class="step-label">ภาพถ่ายหลักฐานการปฏิบัติงาน</div>
          </div>
          <label class="upload-zone" for="daily_file">
            <div class="u-icon">📷</div>
            <div class="u-text">กดเพื่อเปิดกล้องถ่ายภาพ หรือเลือกไฟล์รูปภาพ</div>
            <div class="u-subtext">(รองรับไฟล์รูปภาพงานที่เป็นปัจจุบันเท่านั้น)</div>
            <input type="file" accept="image/*" id="daily_file">
          </label>
          <div id="previewWrap">
            <img id="previewImg" alt="ตัวอย่างภาพถ่ายหลักฐาน">
          </div>
        </div>

        <div class="submit-bar d-none d-lg-block">
          <button type="submit" class="btn-send">บันทึกและส่งรายงานประจำวัน</button>
        </div>
      </form>
    </div>

    <!-- Sidebar Status Column -->
    <div class="side-col">
      <div class="meter-card">
        <div class="meter-top">
          <span class="label">สรุปผลการตรวจสอบเบื้องต้น</span>
          <span class="score" id="meterScore">2/2</span>
        </div>
        <div class="meter-track">
          <div class="meter-seg on" id="seg1"></div>
          <div class="meter-seg on" id="seg2"></div>
        </div>
        <div class="meter-msg" id="meterMsg">ข้อมูลครบถ้วน พร้อมนำส่งเข้าระบบ</div>
      </div>
      
      <!-- Submit button for Mobile/Tablet view -->
      <div class="d-block d-lg-none mt-2">
        <button type="submit" form="dailyForm" class="btn-send">บันทึกและส่งรายงานประจำวัน</button>
      </div>
    </div>

  </div>
</div>

<script>
  window.onload = function() {
    document.getElementById('todayTag').textContent =
      new Date().toLocaleDateString('th-TH', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(data) {
        populateSelect("daily_loc", data.locations);
        populateSelect("daily_staff", data.staffs);
      }).getDashboardData();
    } else {
      // ตัวอย่างข้อมูลสำหรับทดสอบภายนอกระบบ Apps Script
      populateSelect("daily_loc", ["อาคารเรียน 1", "อาคารปฏิบัติการช่างยนต์", "อาคารอำนวยการ ชั้น 1"]);
      populateSelect("daily_staff", ["นายสมชาย ใจดี", "นางสาวสมหญิง รักงาน"]);
    }

    updateMeter();
  };

  function populateSelect(id, list) {
    let select = document.getElementById(id);
    select.innerHTML = list.map(item => `<option value="${item}">${item}</option>`).join('');
  }

  function updateMeter() {
    const cleaningOk = document.getElementById('c_ok').checked;
    const trashOk = document.getElementById('t_ok').checked;
    const seg1 = document.getElementById('seg1');
    const seg2 = document.getElementById('seg2');
    const score = document.getElementById('meterScore');
    const msg = document.getElementById('meterMsg');

    seg1.className = 'meter-seg ' + (cleaningOk ? 'on' : 'warn');
    seg2.className = 'meter-seg ' + (trashOk ? 'on' : 'warn');

    const okCount = (cleaningOk ? 1 : 0) + (trashOk ? 1 : 0);
    score.textContent = okCount + '/2';

    if (okCount === 2) msg.textContent = 'ข้อมูลผ่านเกณฑ์มาตรฐาน พร้อมส่งรายงานได้เลย';
    else if (okCount === 1) msg.textContent = 'ตรวจพบจุดที่ต้องปรับปรุง โปรดบันทึกให้ตรงตามจริง';
    else msg.textContent = 'แจ้งเตือน: ทุกรายการระบุว่าไม่เรียบร้อย โปรดตรวจสอบความถูกต้อง';
  }
  
  document.addEventListener('change', function(e){
    if (e.target && (e.target.name === 'task_cleaning' || e.target.name === 'task_trash')) {
      updateMeter();
    }
  });

  /**
   * ย่อขนาด + บีบอัดรูปภาพผ่าน canvas ก่อนแปลงเป็น base64
   * ช่วยลดขนาดไฟล์จากหลาย MB เหลือหลักร้อย KB โดยยังคงรายละเอียดชัดเจน
   */
  function compressImage(file, maxWidth = 1280, maxHeight = 1280, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          let width = img.width;
          let height = img.height;
          if (width > maxWidth || height > maxHeight) {
            const ratio = Math.min(maxWidth / width, maxHeight / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('ไม่สามารถโหลดรูปภาพได้'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('ไม่สามารถอ่านไฟล์ได้'));
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('daily_file').addEventListener('change', async function(e){
    const file = e.target.files[0];
    const wrap = document.getElementById('previewWrap');
    const img = document.getElementById('previewImg');
    if (file) {
      try {
        const compressed = await compressImage(file);
        img.src = compressed;
        wrap.style.display = 'block';
      } catch (err) {
        Swal.fire('ผิดพลาด', 'ไม่สามารถประมวลผลรูปภาพได้', 'error');
      }
    } else {
      wrap.style.display = 'none';
    }
  });

  async function handleSubmit(type, formEl) {
    Swal.fire({ title: 'กำลังนำส่งข้อมูลเข้าระบบ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

    let file = document.getElementById('daily_file').files[0];
    let formData = {};
    new FormData(formEl).forEach((value, key) => formData[key] = value);

    if (file) {
      try {
        const compressedBase64 = await compressImage(file);
        executeSubmit(type, formData, compressedBase64, file.name.replace(/\.\w+$/, '.jpg'));
      } catch (err) {
        Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถประมวลผลรูปภาพก่อนส่งได้', 'error');
      }
    } else {
      executeSubmit(type, formData, null, null);
    }
  }

  function executeSubmit(type, formData, base64, fileName) {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(res) {
        if(res.status === "success") {
          Swal.fire('สำเร็จ!', 'บันทึกข้อมูลรายงานเรียบร้อยแล้ว', 'success').then(() => location.reload());
        } else {
          Swal.fire('เกิดข้อผิดพลาด', res.message, 'error');
        }
      }).submitReport(type, formData, base64, fileName);
    } else {
      // Fallback จำลองสถานะสำเร็จภายนอกระบบ Apps Script
      setTimeout(() => {
        Swal.fire('สำเร็จ (โหมดทดสอบ)', 'บันทึกข้อมูลรายงานเรียบร้อยแล้ว', 'success').then(() => location.reload());
      }, 1000);
    }
  }
</script>
</body>
</html>
